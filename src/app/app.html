<header class="app-header">
  <span class="app-title">GitHub Analyzer</span>
  <button type="button" class="theme-toggle" (click)="toggleTheme()">{{ themeToggleLabel() }}</button>
</header>

<div class="app-body">
  <aside class="rail">
    <div class="rail-search">
      <app-search [mode]="searchMode()" [initialValue]="lastQuery()" (modeChange)="onModeChange($event)" (search)="onSearch($event)" />
    </div>
    <div class="rail-results">
      <app-search-results
        [mode]="searchMode()"
        [userResults]="userResults()"
        [repoResults]="repoResults()"
        [isLoading]="isSearching()"
        [error]="searchError()"
        [selectedQuery]="selected()?.query ?? null"
        (select)="onSelectResult($event)"
      />
    </div>
  </aside>

  <main class="main-pane">
    @if (selected(); as sel) {
      @if (sel.type === 'user') {
        <app-analyzer [query]="sel.query" (viewRepo)="onViewRepo($event)" />
      } @else {
        <app-repo-analyzer [repoQuery]="sel.query" />
      }
    } @else {
      <div class="main-empty">Select a result to begin</div>
    }
  </main>
</div>
