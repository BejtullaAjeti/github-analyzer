<header class="app-header">
  <span class="app-title">GitHub Analyzer</span>
  <button type="button" class="theme-toggle" (click)="toggleTheme()">{{ themeToggleLabel() }}</button>
</header>

<div class="app-content">
  <app-search [initialValue]="lastQuery()" (search)="onSearch($event)" />

  @if (mode() !== 'results') {
    <button type="button" class="back-button" (click)="backToResults()">← Back to results</button>
  }

  @if (mode() === 'results') {
    <app-search-results
      [mode]="searchMode()"
      [userResults]="userResults()"
      [repoResults]="repoResults()"
      [isLoading]="isSearching()"
      [error]="searchError()"
      (select)="onSelectResult($event)"
    />
  }
  @if (mode() === 'user') {
    <app-analyzer [query]="currentQuery()" />
  }
  @if (mode() === 'repo') {
    <app-repo-analyzer [repoQuery]="currentQuery()" />
  }
</div>
